<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!--
  Plantilla de la imagen Open Graph (public/og-image.jpg).
  Para regenerarla: abrir este archivo en un navegador con la ventana en
  1200x630 y capturar, o bien
    npx playwright screenshot --viewport-size=1200,630 scripts/og-card.html og.png
    magick og.png -strip -quality 92 public/og-image.jpg
  Vive fuera de public/ para que no se publique como una página más del sitio.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    font-family: 'Inter', sans-serif;
    background: #0a0a1a;
    color: #e2e8f0;
  }
  .card {
    position: relative; width: 1200px; height: 630px;
    padding: 68px 72px;
    display: flex; align-items: center; gap: 56px;
    background:
      radial-gradient(70% 90% at 88% 12%, rgba(139, 92, 246, 0.30), transparent 62%),
      radial-gradient(65% 85% at 4% 92%, rgba(99, 102, 241, 0.26), transparent 60%),
      #0a0a1a;
  }
  /* Rejilla tenue, igual que el fondo del sitio */
  .card::before {
    content: ''; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(99,102,241,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(99,102,241,.055) 1px, transparent 1px);
    background-size: 52px 52px;
    mask-image: radial-gradient(85% 85% at 50% 45%, #000 35%, transparent 100%);
  }
  .left { position: relative; flex: 1; display: flex; flex-direction: column; gap: 22px; }
  .badge {
    display: inline-flex; align-items: center; gap: 11px;
    padding: 9px 20px; border-radius: 999px;
    background: rgba(99,102,241,.12); border: 1px solid rgba(99,102,241,.32);
    color: #a5b4fc; font-size: 21px; font-weight: 500; width: fit-content;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #10b981; }
  h1 { font-size: 72px; font-weight: 800; line-height: 1.02; letter-spacing: -.025em; }
  .grad {
    background: linear-gradient(115deg, #818cf8, #c4b5fd 55%, #a78bfa);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  h2 { font-size: 28px; font-weight: 500; color: #94a3b8; line-height: 1.35; }
  h2 b { color: #cbd5e1; font-weight: 600; }
  .stack { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
  .chip {
    padding: 7px 15px; border-radius: 9px;
    background: rgba(99,102,241,.10); border: 1px solid rgba(99,102,241,.26);
    color: #a5b4fc; font-family: 'Fira Code', monospace; font-size: 19px;
  }
  .site {
    margin-top: 8px; font-family: 'Fira Code', monospace;
    font-size: 25px; color: #6366f1; letter-spacing: .01em;
  }
  .right { position: relative; flex-shrink: 0; }
  .photo-ring {
    width: 340px; height: 340px; border-radius: 34px; padding: 4px;
    background: linear-gradient(150deg, #6366f1, #8b5cf6 50%, rgba(99,102,241,.18));
    box-shadow: 0 26px 70px rgba(99,102,241,.34);
  }
  .photo-ring img {
    width: 100%; height: 100%; object-fit: cover; border-radius: 30px; display: block;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="left">
      <div class="badge"><span class="dot"></span>Available for backend &amp; full-stack roles</div>
      <h1>Andrew Garcia<br /><span class="grad">Software Engineer</span></h1>
      <h2><b>Backend &amp; software architecture</b><br />Founder of Lyroo · Armenia, Colombia</h2>
      <div class="stack">
        <span class="chip">Java</span><span class="chip">Spring Boot</span><span class="chip">Go</span>
        <span class="chip">TypeScript</span><span class="chip">Cloudflare</span>
      </div>
      <div class="site">andrewgarcia.dev</div>
    </div>
    <div class="right">
      <div class="photo-ring"><img src="../public/profile.jpg" alt="" /></div>
    </div>
  </div>
</body>
</html>
